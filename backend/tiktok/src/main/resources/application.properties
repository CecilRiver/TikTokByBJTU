spring.application.name=tiktok

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.datasource.url=${DB_URL:jdbc:p6spy:mysql://localhost:3306/tiktok?serverTimezone=GMT%2B8}
spring.datasource.username=${DB_USERNAME:tiktok}
spring.datasource.password=${DB_PASSWORD:}
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.ssl.enable=true
spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:123456}

mybatis-plus.global-config.db-config.logic-delete-field=is_deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

qiniu.kodo.access-key=${QINIU_ACCESS_KEY:}
qiniu.kodo.secret-key=${QINIU_SECRET_KEY:}
qiniu.kodo.bucket-name=${QINIU_BUCKET:tiktokbjtu}

server.port=${SERVER_PORT:8882}

#?????Swagger
swagger.enable=true

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

